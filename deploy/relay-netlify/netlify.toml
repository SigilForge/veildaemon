# Netlify site 3: relay.veildaemon.app.
# Repository: SigilForge/veildaemon
# Package directory: deploy/relay-netlify; Base directory: leave empty.
[build]
  command = "node scripts/prepare-relay-netlify.mjs"
  publish = "deploy/relay-netlify/public"
  ignore = 'test -n "$CACHED_COMMIT_REF" && git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- deploy/relay-netlify studio/relay studio/studio.css studio/assets/brand assets/background.webp scripts/sync-relay-personas.mjs scripts/prepare-relay-netlify.mjs api/character.js api/scan-code.js netlify/functions/api.mjs lib/alertQueue.js package.json package-lock.json'

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "deploy/relay-netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["zxing-wasm"]
  included_files = ["node_modules/zxing-wasm/dist/reader/zxing_reader.wasm"]
