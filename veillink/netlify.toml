# Netlify site 2: app.veildaemon.app and go.veildaemon.app.
# Connect this same repository as a second site with Base directory "veillink".
# Netlify's maintained OpenNext adapter handles Next.js App Router API routes.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Keep Next.js redirects and headers in next.config.ts (the source of truth).
# Preserve Stripe webhooks, auth callbacks and QR redirect behavior on preview.
