# Netlify site 1: root API only. Keep GitHub Pages serving the public site
# until an independently verified static-host migration is scheduled.
[build]
  command = "npm run check"
  publish = "netlify/api-public"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # Keep the WASM reader as a real package so require.resolve() can locate it.
  external_node_modules = ["zxing-wasm"]
  # api/scan-code.js loads this file at startup using require.resolve().
  # Esbuild cannot infer a runtime fs.readFileSync dependency on its own.
  included_files = ["node_modules/zxing-wasm/dist/reader/zxing_reader.wasm"]

# The /api/* path is attached to netlify/functions/api.mjs through its
# exported config. Do not add a broad redirect that bypasses the function.
